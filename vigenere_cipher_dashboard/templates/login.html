<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vigenère Cipher Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100 py-5">
      <div class="col-md-5 col-lg-4">

        <div class="glass-card p-4 p-md-5 shadow-glow">
          <div class="text-center mb-4">
            <span class="icon-bubble mx-auto mb-3"><i class="fa-solid fa-shield-halved fa-lg"></i></span>
            <h3 class="fw-bold gradient-text mb-1">Vigenère Cipher</h3>
            <p class="text-secondary small mb-0">Polyalphabetic Substitution Cipher</p>
          </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
                  <i class="fa-solid fa-circle-info me-2"></i>{{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" id="loginForm" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Enter username" autocomplete="username" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter password" autocomplete="current-password" required>
              </div>
            </div>

            <div id="loginError" class="text-danger small mb-3 d-none"></div>

            <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Login
            </button>
          </form>

          <div class="demo-credentials mt-4 text-center">
            <div class="small text-secondary mb-1">Demo account</div>
            <code>admin / admin123</code>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="{{ url_for('index') }}" class="text-secondary small text-decoration-none">
            <i class="fa-solid fa-arrow-left me-2"></i>Back to home
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
